# Admin UI + API over HTTPS
server {
  listen 80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # single hop; matches TRUST_PROXY_HOPS=1
    proxy_set_header X-Forwarded-Proto https;
  }
  # Frontend static files are added in the frontend phase.
}

# Device ADMS (ZKTeco PUSH) listener.
# Many terminals only speak plain HTTP or old TLS; confirm what the MB10-VL firmware supports
# (see docs/MB10-VL-COMPATIBILITY.md). If HTTP is required, keep this port reachable ONLY from
# device subnets or through a site VPN – never from the internet.
server {
  listen 8081;
  # allow 192.168.10.0/24;   # <- device VLAN(s)
  # deny all;
  client_max_body_size 5m;
  location /iclock/ {
    proxy_pass http://backend:8081;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location / { return 404; }
}
